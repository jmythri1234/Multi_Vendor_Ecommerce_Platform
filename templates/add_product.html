<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - ShopSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h2 {
            color: #38bdf8;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .container h1 {
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #0284c7;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>🛍️ ShopSphere</h2>

    <nav>
        <a href="{{ url_for('seller_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('products') }}">Products</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>

<div class="container">

    <h1>➕ Add New Product</h1>

    <p class="subtitle">
        Add your product details below and make it available in your store.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="{{ url_for('add_product') }}" method="POST">

        <div class="form-group">
            <label for="name">Product Name *</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter product name"
                maxlength="120"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Product Description *</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe your product"
                maxlength="2000"
                required
            ></textarea>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="price">Price (₹) *</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="Enter price"
                    min="0.01"
                    max="100000000"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="stock">Available Stock *</label>
                <input
                    type="number"
                    id="stock"
                    name="stock"
                    placeholder="Enter quantity"
                    min="0"
                    max="1000000"
                    step="1"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="category">Product Category *</label>

            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home & Kitchen">Home & Kitchen</option>
                <option value="Books">Books</option>
                <option value="Beauty">Beauty</option>
                <option value="Sports">Sports</option>
                <option value="Toys">Toys</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="image_url">Product Image URL (Optional)</label>
            <input
                type="url"
                id="image_url"
                name="image_url"
                placeholder="https://example.com/product.jpg"
                maxlength="1000"
            >
        </div>

        <button type="submit">➕ Add Product</button>

    </form>

</div>

</body>
</html>
