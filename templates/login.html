<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ShopSphere</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eeeaff, #e4f4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            color: #5b45d6;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #5b45d6;
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #5b45d6;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4330b0;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            background: #fce8e8;
            color: #9b1c1c;
        }

        .success {
            background: #e5f8eb;
            color: #176b35;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            line-height: 1.8;
        }

        a {
            color: #5b45d6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🛍️ ShopSphere</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">Login to continue shopping.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
            <br>
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>

    </div>

</body>
</html>
